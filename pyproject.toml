[project]
name = "storytelling-agent"
version = "0.1.0"
description = "AI Storytelling Agent (uAgents) - framework-led narrative development for business, brand, and communication."
requires-python = ">=3.11"
dependencies = [
  "agents-shared",
  "aiohttp>=3.9.0",
  "openai>=1.40.0",
  "langgraph>=0.6.0",
  "langgraph-checkpoint-postgres>=3.0.4",
  "psycopg[binary]>=3.3.3",
  "pydantic>=2.12.5",
  "python-dotenv>=1.0.0",
  "uagents>=0.24.0",
  "uagents-core>=0.4.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.uv.sources]
agents-shared = { path = "../../agents_shared", editable = true }
